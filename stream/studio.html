<!doctype html>
<!-- The studio, served by serve.mjs: every scene of overlay.html side by side with its settings, reloaded on save. -->
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Studio</title>
	<style>
		:root {
			--paper: #0e0f0c;
			--ink: #eeefe6;
			--muted: #a4a798;
			--line: #3a3d33;
			--accent: #c8f031;
			--on-accent: #111210;
			--sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			--serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
			--mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
			color-scheme: dark;
		}
		*, *::before, *::after { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font: 15px/1.4 var(--sans); display: grid; grid-template-rows: auto 1fr; }

		header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
		h1 { margin: 0; font: italic 400 26px/1 var(--serif); letter-spacing: -0.02em; }
		.status { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; font: 13px var(--mono); color: var(--muted); }
		.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
		.status.is-on::before { background: var(--accent); }
		.status.is-flash { color: var(--accent); }

		/* The scene switch: one segmented row, the scene shown in lime */
		.scenes { display: flex; border: 1px solid var(--line); }
		.scenes button { padding: 8px 14px; border: 0; border-right: 1px solid var(--line); background: none; color: var(--ink); font: 600 14px var(--sans); letter-spacing: -0.01em; cursor: pointer; }
		.scenes button:last-child { border-right: 0; }
		.scenes button:hover { background: #1a1c17; }
		.scenes button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
		.scenes kbd { margin-left: 6px; font: 11px var(--mono); opacity: 0.6; }

		main { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
		.stage { position: relative; padding: 24px; min-width: 0; }
		/* The canvas, 1920×1080 scaled to fit, on a checkerboard: what OBS composites under it */
		.canvas { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; outline: 1px solid var(--line); background: repeating-conic-gradient(#1b1d24 0 25%, #23262f 0 50%) 0 0 / 32px 32px; }
		.canvas iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; background: transparent; }

		aside { display: flex; flex-direction: column; gap: 22px; padding: 24px; border-left: 1px solid var(--line); overflow-y: auto; }
		fieldset { margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px; }
		legend { margin-bottom: 10px; font: 12px var(--mono); color: var(--muted); }
		label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
		input[type="text"], input[type="number"] { padding: 8px 10px; border: 1px solid var(--line); background: none; color: var(--ink); font: 14px var(--sans); }
		input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
		.toggle { flex-direction: row; align-items: center; justify-content: space-between; cursor: pointer; }
		.toggle input { appearance: none; width: 34px; height: 20px; margin: 0; border: 1px solid var(--line); border-radius: 10px; position: relative; cursor: pointer; transition: background 0.15s; }
		.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: transform 0.15s, background 0.15s; }
		.toggle input:checked { background: var(--accent); border-color: var(--accent); }
		.toggle input:checked::after { transform: translateX(14px); background: var(--on-accent); }
		.url { padding: 10px; border: 1px solid var(--line); font: 12px/1.5 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
		.alert-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
		.alert-buttons button { padding: 7px 10px; border: 1px solid var(--line); background: none; color: var(--ink); font: 600 13px var(--sans); cursor: pointer; }
		.alert-buttons button:hover { border-color: var(--accent); color: var(--accent); }
		.copy { align-self: flex-start; padding: 7px 12px; border: 1px solid var(--accent); background: none; color: var(--accent); font: 600 13px var(--sans); cursor: pointer; }
		.copy:hover { background: var(--accent); color: var(--on-accent); }

		@media (max-width: 900px) {
			main { grid-template-columns: 1fr; }
			aside { border-left: 0; border-top: 1px solid var(--line); }
			.stage { padding: 16px; }
			header { padding: 12px 16px; }
		}
	</style>
</head>
<body>
	<header>
		<h1>Studio</h1>
		<nav class="scenes" id="scenes" aria-label="Scène"></nav>
		<span class="status" id="status">connexion…</span>
	</header>
	<main>
		<div class="stage">
			<div class="canvas" id="canvas"><iframe id="frame" title="Aperçu de l'overlay"></iframe></div>
		</div>
		<aside>
			<fieldset>
				<legend>Contenu</legend>
				<label>Chaîne <input type="text" data-param="channel" value="medianmusic"></label>
				<label>Sujet <input type="text" data-param="topic" placeholder="Un thème WordPress"></label>
				<label>Prochain live <input type="text" data-param="next" placeholder="Jeudi, 20 h"></label>
				<label>Compte à rebours (min) <input type="number" min="0" data-param="in" placeholder="5"></label>
			</fieldset>
			<fieldset>
				<legend>Affichage</legend>
				<label class="toggle">Démo (faux chat, alertes, musique) <input type="checkbox" data-flag="demo" checked></label>
				<label class="toggle">Fausse capture <input type="checkbox" data-flag="preview" checked></label>
				<label class="toggle">Webcam <input type="checkbox" data-flag="cam" data-off="0" checked></label>
				<label class="toggle">Chat <input type="checkbox" data-flag="chat" data-off="0" checked></label>
				<label class="toggle">Thème clair <input type="checkbox" data-flag="theme" data-on="light"></label>
				<label class="toggle">English <input type="checkbox" data-flag="lang" data-on="en"></label>
			</fieldset>
			<fieldset>
				<legend>Tester les alertes</legend>
				<div class="alert-buttons">
					<button type="button" data-alert="follow">Follow</button>
					<button type="button" data-alert="sub">Abonnement</button>
					<button type="button" data-alert="resub">Réabonnement</button>
					<button type="button" data-alert="gifts">Abos offerts</button>
					<button type="button" data-alert="raid">Raid</button>
					<button type="button" data-alert="bits">Bits</button>
				</div>
			</fieldset>
			<fieldset>
				<legend>URL pour OBS</legend>
				<div class="url" id="url"></div>
				<button class="copy" type="button" id="copy">Copier</button>
			</fieldset>
		</aside>
	</main>

	<script>
		const SCENES = [["game", "Écran"], ["full", "Jeu plein écran"], ["chat", "Discussion"], ["start", "Début"], ["pause", "Pause"], ["end", "Fin"]];
		const OBS_BASE = "file:///Users/corentin/Projects/corentin-gautier.github.io/stream/overlay.html";
		const frame = document.getElementById("frame");
		const canvas = document.getElementById("canvas");
		const status = document.getElementById("status");
		const fields = [...document.querySelectorAll("[data-param], [data-flag]")];

		// The settings stay from one visit to the next, in this browser only
		const store = {
			get() { try { return JSON.parse(localStorage.getItem("studio")) || {}; } catch { return {}; } },
			set(value) { try { localStorage.setItem("studio", JSON.stringify(value)); } catch {} },
		};
		const saved = store.get();
		let scene = saved.scene || "game";
		for (const field of fields) {
			const key = field.dataset.param || field.dataset.flag;
			if (!(key in (saved.fields || {}))) continue;
			if (field.type === "checkbox") field.checked = saved.fields[key];
			else field.value = saved.fields[key];
		}

		const nav = document.getElementById("scenes");
		SCENES.forEach(([id, label], index) => {
			const button = document.createElement("button");
			button.type = "button";
			button.dataset.scene = id;
			button.innerHTML = `${label}<kbd>${index + 1}</kbd>`;
			button.addEventListener("click", () => show(id));
			nav.append(button);
		});

		// What OBS needs, and what only the studio adds (demo, fake capture)
		function query({ studio }) {
			const params = new URLSearchParams();
			params.set("channel", "");
			for (const field of document.querySelectorAll("[data-param]")) {
				if (field.dataset.param === "in" && scene !== "start") continue;
				if (field.value.trim()) params.set(field.dataset.param, field.value.trim());
			}
			if (!params.get("channel")) params.delete("channel");
			if (scene !== "game") params.set("scene", scene);
			for (const field of document.querySelectorAll("[data-flag]")) {
				const { flag, on, off } = field.dataset;
				if (["demo", "preview"].includes(flag)) {
					if (studio && field.checked) params.set(flag, "1");
				} else if (field.checked && on) params.set(flag, on);
				else if (!field.checked && off) params.set(flag, off);
			}
			return params.toString();
		}

		function show(id) {
			scene = id;
			for (const button of nav.children) button.setAttribute("aria-pressed", button.dataset.scene === id);
			frame.src = `overlay.html?${query({ studio: true })}`;
			document.getElementById("url").textContent = `${OBS_BASE}?${query({ studio: false })}`;
			store.set({ scene, fields: Object.fromEntries(fields.map(f => [f.dataset.param || f.dataset.flag, f.type === "checkbox" ? f.checked : f.value])) });
		}

		let typing;
		for (const field of fields) field.addEventListener("input", () => { clearTimeout(typing); typing = setTimeout(() => show(scene), 300); });

		addEventListener("keydown", (event) => {
			if (event.target.closest("input") || event.metaKey || event.ctrlKey) return;
			const scene = SCENES[Number(event.key) - 1];
			if (scene) show(scene[0]);
		});

		document.getElementById("copy").addEventListener("click", async (event) => {
			try {
				await navigator.clipboard.writeText(document.getElementById("url").textContent);
				event.target.textContent = "Copié";
				setTimeout(() => { event.target.textContent = "Copier"; }, 1500);
			} catch {}
		});

		// Test alerts go straight to the preview, which listens for them as it does for the dock's
		for (const button of document.querySelectorAll("[data-alert]")) {
			button.addEventListener("click", () => {
				const alert = { kind: button.dataset.alert, name: "pixel_louis" };
				if (alert.kind === "resub") alert.text = "Toujours là pour les lives du jeudi !";
				const view = frame.contentWindow;
				view?.dispatchEvent(new view.CustomEvent("overlay-alert", { detail: alert }));
			});
		}

		// The 1920×1080 overlay, scaled to the canvas
		new ResizeObserver(([entry]) => { frame.style.transform = `scale(${entry.contentRect.width / 1920})`; }).observe(canvas);

		// Live reload: the preview on an overlay save, the whole page when the studio itself changes
		function listen() {
			const events = new EventSource("/__livereload");
			events.onopen = () => { status.textContent = "à l'écoute"; status.classList.add("is-on"); };
			events.onerror = () => { status.textContent = "serveur arrêté"; status.classList.remove("is-on"); };
			events.onmessage = ({ data }) => {
				if (data === "studio.html") return location.reload();
				frame.src = frame.src;
				status.textContent = `${data} rechargé`;
				status.classList.add("is-flash");
				setTimeout(() => { status.classList.remove("is-flash"); status.textContent = "à l'écoute"; }, 1500);
			};
		}

		show(scene);
		listen();
	</script>
</body>
</html>
